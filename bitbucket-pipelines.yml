# bitbucket-pipelines.yml  (repo root - this is the file Bitbucket actually reads)
image: atlassian/default-image:2          # base image with ssh + git

pipelines:
  branches:
    main:                                 # runs only on pushes to main
      - step:
          name: Deploy to Production
          deployment: production
          script:
            # Export the repo variables so the ssh-run pipe can see them
            - export SSH_KEY="${PROD_SSH_KEY}"
            - export SERVER="${PROD_HOST}"
            - export USER="${PROD_USER}"
            - export DEPLOY_PATH="${PROD_DEPLOY_PATH}"
            # Run the deploy on the production host via the official ssh-run pipe
            - pipe: atlassian/ssh-run:0.4.1
              variables:
                SSH_USER: $USER
                SERVER: $SERVER
                SSH_KEY: $SSH_KEY
                COMMAND: |
                  set -e
                  cd "$DEPLOY_PATH"
                  echo "Fetching latest code..."
                  git fetch origin main
                  git reset --hard origin/main
                  echo "Installing dependencies..."
                  npm ci
                  echo "Building site..."
                  npm run build
                  echo "Restarting the app (Astro SSR), not nginx..."
                  sudo systemctl restart info-hub.service
