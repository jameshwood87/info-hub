image: atlassian/default-image:2

pipelines:
  branches:
    main:
      - step:
          name: Deploy to Production
          deployment: production
          script:
            - export SSH_KEY="${PROD_SSH_KEY}"
            - export SERVER="${PROD_HOST}"
            - export USER="${PROD_USER}"
            - export DEPLOY_PATH="${PROD_DEPLOY_PATH}"
            - pipe: atlassian/ssh-run:0.4.1
              variables:
                SSH_USER: $USER
                SERVER: $SERVER
                SSH_KEY: $SSH_KEY
                COMMAND: |
                  set -e
                  cd "$DEPLOY_PATH"
                  echo "🔧 Pulling latest code..."
                  git pull origin main
                  echo "📦 Installing dependencies..."
                  npm ci
                  echo "🏗️ Building site..."
                  npm run build
                  echo "🚀 Restarting service..."
                  sudo systemctl restart nginx
                  echo "🔍 Health check..."
                  curl -fsS https://info.propertylist.es/healthz || { echo "❌ Health check failed"; exit 1; }
